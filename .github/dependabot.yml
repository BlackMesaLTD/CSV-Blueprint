# Keeps every pinned input current: base image digests (Dockerfile), action SHAs (workflows) and composer.lock.
# A 14-day cooldown means only versions at least two weeks old are proposed, the same rule used when pinning by hand.

version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      docker:
        patterns: [ "*" ]
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: [ "*" ]
    commit-message:
      prefix: ci

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      composer-production:
        dependency-type: production
      composer-development:
        dependency-type: development
    commit-message:
      prefix: chore
