# Runs when a release drafted by release.yml is published. The image was built and pushed by release.yml;
# this checks that the tagged action.yml runs exactly that image, then attaches the phar.

name: Publish

on:
  release:
    types: [ published ]

permissions: {}

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/blackmesaltd/csv-blueprint
  TAG: ${{ github.event.release.tag_name }}

jobs:
  verify-image:
    name: Verify the action image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read     # read action.yml at the tag
      attestations: read # verify the image's provenance
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Check action.yml is pinned to this release's image by digest
        id: pin
        run: |
          line="$(grep -E "^  image: 'docker://${IMAGE}:${TAG}@sha256:[0-9a-f]{64}'\$" action.yml || true)"
          if [ -z "${line}" ]; then
            echo "::error file=action.yml::runs.image must be 'docker://${IMAGE}:${TAG}@sha256:<digest>'; release with release.yml"
            exit 1
          fi
          echo "digest=$(echo "${line}" | sed -E 's/.*@(sha256:[0-9a-f]{64}).*/\1/')" >> "${GITHUB_OUTPUT}"

      - name: Check the image's provenance
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.pin.outputs.digest }}
        run: gh attestation verify "oci://${IMAGE}@${DIGEST}" --repo "${GITHUB_REPOSITORY}"

      - name: Check the image is publicly pullable and reports this version
        env:
          DIGEST: ${{ steps.pin.outputs.digest }}
        run: |
          docker run --rm "${IMAGE}@${DIGEST}" -V | tee version.txt
          grep -qF "v${TAG}" version.txt

  phar:
    name: Publish Phar
    needs: [ verify-image ]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # upload the phar to the release
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.4
          tools: composer

      - name: Build project in production mode
        run: make build-prod build-phar-file --no-print-directory

      - name: 🎨 Test Phar file
        run: ./build/csv-blueprint.phar --ansi -vvv

      - name: Upload Phar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${TAG}" ./build/csv-blueprint.phar
