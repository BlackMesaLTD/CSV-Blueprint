# Releases are cut from main by hand (Actions > Release > Run workflow) and run in order:
#
#   image:   build and push ghcr.io/...:VERSION once, attest its provenance
#   release: pin action.yml to that image's digest, commit to main, draft the GitHub release there
#   (you):   review the draft's notes and publish it; publish.yml then verifies the pin and attaches the phar
#
# action.yml names the image by digest, so a pinned action commit always runs exactly the image built here,
# even if the tag were pushed again. This workflow also refuses to reuse a version or overwrite an image tag.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.3.1'
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/blackmesaltd/csv-blueprint
  VERSION: ${{ inputs.version }}

jobs:
  image:
    name: Build and push the image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read      # check out main
      packages: write     # push the image
      id-token: write     # sign the provenance attestation
      attestations: write # store it
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the version is new
        id: version
        run: |
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like 1.2.3, got: ${VERSION}"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "::error::Tag ${VERSION} already exists"
            exit 1
          fi
          if docker buildx imagetools inspect "${IMAGE}:${VERSION}" >/dev/null 2>&1; then
            echo "::error::${IMAGE}:${VERSION} already exists. Image tags are never overwritten; release a new version."
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          context: .
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Verify the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker logout ghcr.io
          docker run --rm "${IMAGE}@${DIGEST}" -V | tee version.txt
          grep -qF "v${VERSION}" version.txt

  release:
    name: Pin the action and draft the release
    needs: [ image ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # commit the pin to main and draft the release
    env:
      DIGEST: ${{ needs.image.outputs.digest }}
      BUILT_FROM: ${{ needs.image.outputs.commit }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Check main hasn't moved since the image was built
        run: |
          if [ "$(git rev-parse HEAD)" != "${BUILT_FROM}" ]; then
            echo "::error::main moved after the image was built from ${BUILT_FROM}; run the release again"
            exit 1
          fi

      - name: Pin action.yml to the image digest
        run: |
          if ! [[ "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Unexpected image digest: ${DIGEST}"
            exit 1
          fi
          sed -i -E "s#^  image: '.*'\$#  image: 'docker://${IMAGE}:${VERSION}@${DIGEST}'#" action.yml
          grep -qxF "  image: 'docker://${IMAGE}:${VERSION}@${DIGEST}'" action.yml

      - name: Commit the pin and draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: pin action image to ${VERSION}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" push origin HEAD:main
          gh release create "${VERSION}" --draft --target "$(git rev-parse HEAD)" --title "${VERSION}" --generate-notes
