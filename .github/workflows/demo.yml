name: Demo
permissions:
  contents: read

# Demonstrates this repository's own action and image. The release image exists before the release is published
# (see release.yml), so the demo can run on publish.
on:
  release:
    types: [ published ]
  workflow_dispatch:

env:
  CSV_FILES: './tests/fixtures/batch/*.csv'
  VALID_SCHEMA: './tests/schemas/demo_valid.yml'
  INVALID_SCHEMA: './tests/schemas/demo_*.yml'


jobs:
  reports:
    name: All Report Types
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 👍 Valid CSV files
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.VALID_SCHEMA }}

      - name: 👎 Invalid CSV files - Default (Table)
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
        continue-on-error: true

      - name: Invalid CSV files - Text
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
          report: text
        continue-on-error: true

      - name: Invalid CSV files - GitHub Annotations
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
          report: github
        continue-on-error: true

      - name: Invalid CSV files - TeamCity
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
          report: teamcity
        continue-on-error: true

      - name: Invalid CSV files - Gitlab
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
          report: gitlab
        continue-on-error: true

      - name: Invalid CSV files - JUnit
        uses: ./
        with:
          csv: ${{ env.CSV_FILES }}
          schema: ${{ env.INVALID_SCHEMA }}
          report: junit
        continue-on-error: true


  create-schema:
    name: Create schema based on CSV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker pull the action's image
        run: |
          image="$(sed -nE "s#^  image: 'docker://(.+)'\$#\1#p" action.yml)"
          docker pull "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: 👍 Create schema based on `demo.csv`
        run: docker run --rm --workdir=/files -v .:/files "${IMAGE}" create-schema -c ./tests/fixtures/demo.csv --check-syntax --ansi


  debug-schema:
    name: Debug schema with presets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker pull the action's image
        run: |
          image="$(sed -nE "s#^  image: 'docker://(.+)'\$#\1#p" action.yml)"
          docker pull "${image}"
          echo "IMAGE=${image}" >> "${GITHUB_ENV}"

      - name: 👍 Debug schema with presets `preset_usage.yml`
        run: docker run --rm --workdir=/files -v .:/files "${IMAGE}" debug-schema -s ./schema-examples/preset_usage.yml --ansi
